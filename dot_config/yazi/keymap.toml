# clipboard
# Copy selected/hovered files to the system clipboard
[[mgr.prepend_keymap]]
on  = "<C-y>"
run = "plugin system-clipboard"
desc = "Copy files to system clipboard"

# Paste files from the system clipboard into the current directory
[[mgr.prepend_keymap]]
on  = "<C-p>"
run = "shell 'cb paste'"
desc = "Paste files from system clipboard"
