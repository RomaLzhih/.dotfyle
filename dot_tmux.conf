set-window-option -g mode-keys vi

set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-overrides ",xterm-ghostty:Tc"
set-option -g default-terminal "tmux-256color"


# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
# Cursor color passthrough (OSC 12). tmux-256color has Cs/Cr so apps inside
# tmux (nvim) can set the cursor color, but xterm-ghostty's terminfo lacks
# them, so tmux would swallow the change instead of forwarding it outward.
set -as terminal-overrides ',*:Cs=\E]12;%p1%s\007:Cr=\E]112\007'

# name windows after the command running in them
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{pane_current_command}"
# set-option -g automatic-rename-format "#{b:pane_current_path}"
# set-option -g automatic-rename-format "#(echo #{pane_current_path} | sed 's|^$HOME/||')"

# Forward the shell-set tab label (home-relative path / ssh host, set by the zsh
# title hook into the @tab_label pane option) out to the terminal's tab, so
# kitty/Ghostty tabs show it even inside tmux. Using @tab_label instead of
# pane_title means a remote (ssh) session can't overwrite it with its own titles.
# allow-rename off keeps OSC titles out of the *window* name above.
set-option -g set-titles on
set-option -g set-titles-string "#{@tab_label}"
set-option -g allow-rename off

# new panes inherit the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# daily session (yazi | cal | mutt x2 | zulip-term).
# G = go to / build the layout, F = fix panes a sleep/wake cycle broke.
# R is tmux-sensible's source-file, D is choose-client, M is select-pane -M.
# Layout runs in the foreground so the session exists before switch-client;
# repair runs backgrounded so the key returns immediately, and reports back with
# its own "repair done" message when the panes are up.
bind G run-shell "~/code/daily_workflow/daily-layout.sh --no-attach" \; switch-client -t "=daily"
bind F run-shell -b "~/code/daily_workflow/daily-repair.sh '#{client_name}'" \; display-message "daily: repair started…"

set -g mouse on
set -s set-clipboard on
# List of plugins
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
# set -g @plugin 'MunifTanjim/tmux-suspend'
# reconstruct for nvim
# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'

# automatically update the number
set -g renumber-windows on
# Keep session numbers contiguous (0,1,2,...). tmux names an unnamed session
# after its session *id* -- a counter that only ever goes up, once per session
# ever created on this server -- so after a while `tmux new` was handing out
# names like "22" on a server whose only other session was `daily`. Renumbering
# on create as well as on close puts a fresh unnamed session back at 0. Named
# sessions are left alone by the script.
set-hook -g session-closed  'run-shell ~/.config/tmux/renumber-sessions.sh'
set-hook -g session-created 'run-shell ~/.config/tmux/renumber-sessions.sh'
# for suspend
# set -g @suspend_key 'F12'

# rose pine
set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn'
set -g @rose_pine_host 'on' # Enables hostname in the status bar
# set -g @rose_pine_date_time '%R , %d %b' # It accepts the date UNIX command format (man date for info)
# set -g @rose_pine_user 'on' # Turn on the username component in the statusbar
# set -g @rose_pine_directory 'on' # Turn on the current folder component in the status bar

# set -g @rose_pine_window_tabs_enabled 'on'
# set -g @rose_pine_default_window_behavior 'on'
# set -g @rose_pine_show_pane_directory 'on' # Forces tmux to show the current directory as window name

# Example values for these can be:
set -g @rose_pine_left_separator ' > ' # The strings to use as separators are 1-space padded
set -g @rose_pine_right_separator ' < ' # Accepts both normal chars & nerdfont icons
set -g @rose_pine_field_separator ' | ' # Again, 1-space padding, it updates with prefix + I
set -g @rose_pine_window_separator ' - ' # Replaces the default `:` between the window number and name

# These are not padded
set -g @rose_pine_session_icon '' # Changes the default icon to the left of the session name
set -g @rose_pine_current_window_icon '' # Changes the default icon to the left of the active window name
set -g @rose_pine_folder_icon '' # Changes the default icon to the left of the current directory folder
set -g @rose_pine_username_icon '' # Changes the default icon to the right of the hostname
set -g @rose_pine_hostname_icon '󰒋' # Changes the default icon to the right of the hostname
set -g @rose_pine_date_time_icon '󰃰' # Changes the default icon to the right of the date module
set -g @rose_pine_window_status_separator "  " # Changes the default icon that appears between window names

#  cpu load
#  set -g @rose_pine_status_left_prepend_section '#{tmux_mode_indicator}'
set -g @rose_pine_status_left_prepend_section '#{tmux_mode_indicator}'
# set -g @rose_pine_status_right_prepend_section 'with normal text'
# set -g @rose_pine_status_right_append_section 'too'
set -g @rose_pine_status_right_prepend_section ' #(~/.config/tmux/mutt-unread.sh)#(~/.config/tmux/zulip-unread.sh)'
# set -g status-right '#[fg=black]#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load --colors --cpu-mode 1 --powerline-right --interval 1 -a 0)#[default]'
#
# bind C-s set-option -g status
# set-option -g status-bg default
# set-option -g status-fg colour240
# tmux config
# navigation
set -g @tmux-nvim-navigation true
set -g @tmux-nvim-navigation-keybinding-left 'C-h'
set -g @tmux-nvim-navigation-keybinding-down 'C-j'
set -g @tmux-nvim-navigation-keybinding-up 'C-k'
set -g @tmux-nvim-navigation-keybinding-right 'C-l'

run '~/.tmux/plugins/tpm/tpm'

# tmux 3.7 dropped the default escape-time from 500ms to 10ms; over ssh,
# escape sequences split across packets then leak into panes as literal keys.
# Keep after the tpm line (and not exactly 500, which tmux-sensible resets to 0).
set -s escape-time 200

# New panes inherit the current pane's working directory.
# Kept after the tpm line so plugins can't override the bindings.
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Keep numeric session names packed as 0, 1, 2, ... on every create and kill, so
# killing session 1 slides 2 down into its place. tmux's own session counter only
# climbs and never reuses a number. Named sessions are left alone.
set-hook -g session-created 'run-shell -b "~/.tmux/scripts/compact-sessions.sh"'
set-hook -g session-closed  'run-shell -b "~/.tmux/scripts/compact-sessions.sh"'
